name: Build and push Docker image

# Publishes ghcr.io/<owner>/mirofish so servers can pull a ready image instead
# of building it (the build needs PyPI, npm and Hugging Face access and a lot
# of RAM).
on:
  push:
    branches: [main, "claude/focused-knuth-3zzg2c"]
    tags: ["*"]
    paths-ignore: ["**.md", "deploy/vps-setup.sh"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mirofish
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - name: Build and push MiroFish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Neo4j wrapper
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/neo4j
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/mirofish-neo4j:latest

      - name: Build and push Caddy proxy
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/caddy
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/mirofish-caddy:latest
